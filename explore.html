<body data-page="explore">
<main id="main">
  <header class="page-head"><div class="wrap">
    <div class="kicker">Find tools</div>
    <h1>Find the right AI tool for the job.</h1>
    <p class="lead">Free apps, skills and connectors, each explained in plain English: what it does, what you'd use it for, and how to start. Pick a goal, then click any tool for the steps.</p>

      <label class="sr" for="repoQ">Search tools</label>
      <input id="repoQ" class="hero-search" style="height:48px;max-width:420px" type="search" placeholder="Search: excel, pdf, voice, notion…">
      <div class="chips" id="sortChips" style="margin:0" aria-label="Sort"></div>
    </div>
    <div id="catWhat"></div>
    <div class="tool-grid" id="repoGrid"></div>
  </div></section>
