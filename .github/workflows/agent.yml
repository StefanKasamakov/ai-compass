# The Which AI Map agent: refreshes data every 6 hours, watches models daily, deploys the site.
name: agent

on:
  schedule:
    - cron: "17 */6 * * *"   # data refresh (GitHub stats, trending, news, votes)
    - cron: "41 4 * * *"     # daily model watch (AI opens a PR if models changed)
    - cron: "7 7 * * 1"      # Monday: weekly newsletter
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      explain_limit:
        description: "Max repos to explain this run (raise for a one-off backfill)"
        default: "12"
      newsletter:
        description: "Also build this week's newsletter now"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: agent
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: npm ci --prefix agent

      - name: Refresh data
        run: node agent/update.mjs
        env: { CREATE_VOTE_ISSUES: "1", EXPLAIN_LIMIT: "${{ inputs.explain_limit || '12' }}" }

      - name: Newsletter (Mondays, or on demand)
        if: github.event.schedule == '7 7 * * 1' || inputs.newsletter
        continue-on-error: true
        run: node agent/newsletter.mjs

      - name: Community (apply approved submissions, weekly social drafts)
        continue-on-error: true
        run: node agent/community.mjs
        env: { MAKE_SOCIAL: "${{ (github.event.schedule == '7 7 * * 1' || inputs.newsletter) && '1' || '' }}" }

      - name: Commit data
        run: |
          git config user.name "ai-compass-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data feed.xml 2>/dev/null || git add data
          git diff --cached --quiet || { git commit -m "agent: refresh data" && git push; }

      - name: Model watch (AI → pull request)
        continue-on-error: true   # a failed model check must never block publishing fresh data
        if: (env.GEMINI_API_KEY != '' || env.ANTHROPIC_API_KEY != '') && (github.event.schedule == '41 4 * * *' || github.event_name == 'workflow_dispatch')
        env: { PR_BODY: pr-body.md, GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          node agent/models-watch.mjs
          git diff --quiet data/models.json && exit 0
          branch="agent/models-$(date +%F)"
          git checkout -b "$branch"
          git add data/models.json
          git commit -m "agent: model lineup changes"
          git push -f origin "$branch"
          gh pr create --title "Model lineup update $(date +%F)" --body-file pr-body.md --base main --head "$branch" || gh pr edit "$branch" --body-file pr-body.md

  deploy:
    needs: update
    if: always() && needs.update.result != 'failure'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - name: Build comparison pages
        run: node agent/compare.mjs
      - name: Build site folder
        run: mkdir _site && cp -r *.html assets data _site/ && cp sitemap.xml robots.txt CNAME _site/ && (cp feed.xml _site/ 2>/dev/null || true)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
