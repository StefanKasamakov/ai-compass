name: Explain a repo
description: Ask the AI Compass agent to explain what a GitHub repo is for. You get +2 leaderboard points when it's added.
title: "Explain: "
labels: [explain]
body:
  - type: input
    id: repo
    attributes:
      label: GitHub link
      placeholder: https://github.com/owner/repo
    validations: { required: true }
  - type: textarea
    id: context
    attributes:
      label: What confuses you about it? (optional)
